appId: 'cgn.mcl'
productName: 'CraftGame Launcher'
artifactName: 'CraftGameLauncher-Setup-${version}.${ext}'
executableName: 'cgnml'

copyright: 'Copyright © 2025 CraftGame.net'

asar: true
compression: 'maximum'

files:
    - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,.eslintrc.json}'

extraResources:
    - 'libraries'

publish:
    provider: 'github'
    owner: 'craftgame-net'
    repo: 'minecraft-launcher'

# Windows Configuration
win:
    target:
        - target: 'nsis'
          arch: 'x64'

# Windows Installer Configuration
nsis:
    oneClick: false
    perMachine: false
    allowElevation: true
    allowToChangeInstallationDirectory: true
    include: 'build/installer.nsh'

## macOS Configuration
mac:
    target:
        - target: 'dmg'
          arch:
              - 'arm64'
    artifactName: 'CraftGameLauncher-${version}-${arch}.${ext}'
    category: 'public.app-category.games'

# Linux Configuration
linux:
    target: 'deb'
    maintainer: 'CraftGame.net'
    vendor: 'CraftGame.net'
    synopsis: 'CraftGame.net Minecraft Launcher'
    description: 'Launcher to play on CraftGame.net'
    category: 'Game'
    mimeTypes: [x-scheme-handler/cgnml]

directories:
    buildResources: 'build'
    output: 'dist'
